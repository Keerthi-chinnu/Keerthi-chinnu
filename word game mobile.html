<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Typing Tank Defense</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }
    
    body {
        background: black;
        color: #0f0;
        font-family: monospace;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        position: fixed;
        touch-action: none;
    }
    
    #gameCanvas {
        display: block;
        width: 100%;
        height: 100%;
    }
    
    #stats {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        font-size: 14px;
        line-height: 1.5;
    }
    
    #modeButtons {
        position: fixed;
        top: 80px;
        left: 10px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }
    
    .mode-btn {
        background: black;
        border: 2px solid #0f0;
        color: #0f0;
        padding: 8px 12px;
        cursor: pointer;
        font-family: monospace;
        font-size: 12px;
        transition: all 0.2s;
    }
    
    .mode-btn.active {
        background: #0f0;
        color: white;
    }
    
    #inputDisplay {
        position: fixed;
        bottom: 190px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 500px;
        background: rgba(0, 0, 0, 0.8);
        border: 3px solid #0f0;
        color: #0f0;
        font-size: 24px;
        padding: 15px;
        font-family: monospace;
        text-align: center;
        z-index: 7;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    #keyboard {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 98%;
        background: rgba(0, 0, 0, 0.95);
        padding: 8px;
        z-index: 8;
        border-top:0px solid #0f0;
    }
    
    .keyboard-row {
        display: flex;
        justify-content: center;
        gap:0.6px;
        margin-bottom: 2px;
    }
    
    .key {
        background: black;
        border:0px solid #0f0;
        color: #0f0;
        padding: 12px;
        font-family: monospace;
        font-size: 16px;
        cursor: pointer;
        flex: 1;
        max-width: 45px;
        text-align: center;
        user-select: none;
        transition: all 0.1s;
    }
    
    .key:active {
        background: #0f0;
        color: black;
        transform: scale(0.95);
    }
    
    .key.special {
        flex: 1.5;
        max-width: 70px;
        font-size: 12px;
    }
    
    .key.space {
        flex: 4;
        max-width: 200px;
    }
    
    #startScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
    }
    
    #startScreen.hide {
        display: none;
    }
    
    #startBtn {
        background: #0f0;
        color: black;
        border: none;
        padding: 30px 60px;
        font-size: 32px;
        font-weight: bold;
        font-family: monospace;
        cursor: pointer;
        transition: all 0.2s;
    }
    
    #startBtn:active {
        transform: scale(0.95);
        background: #0d0;
    }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="startScreen">
    <button id="startBtn">START</button>
</div>

<div id="stats">
    <div>Score: <span id="scoreDisplay">0</span></div>
    <div>Level: <span id="levelDisplay">1</span></div>
    <div>Health: <span id="healthDisplay">100</span></div>
</div>

<div id="modeButtons">
    <button class="mode-btn active" data-mode="easy">Easy</button>
    <button class="mode-btn" data-mode="normal">Normal</button>
    <button class="mode-btn" data-mode="hard">Hard</button>
    <button class="mode-btn" data-mode="extreme">Extreme</button>
</div>

<div id="inputDisplay"></div>

<div id="keyboard">
    <div class="keyboard-row">
        <div class="key" data-key="q">Q</div>
        <div class="key" data-key="w">W</div>
        <div class="key" data-key="e">E</div>
        <div class="key" data-key="r">R</div>
        <div class="key" data-key="t">T</div>
        <div class="key" data-key="y">Y</div>
        <div class="key" data-key="u">U</div>
        <div class="key" data-key="i">I</div>
        <div class="key" data-key="o">O</div>
        <div class="key" data-key="p">P</div>
    </div>
    <div class="keyboard-row">
        <div class="key" data-key="a">A</div>
        <div class="key" data-key="s">S</div>
        <div class="key" data-key="d">D</div>
        <div class="key" data-key="f">F</div>
        <div class="key" data-key="g">G</div>
        <div class="key" data-key="h">H</div>
        <div class="key" data-key="j">J</div>
        <div class="key" data-key="k">K</div>
        <div class="key" data-key="l">L</div>
    </div>
    <div class="keyboard-row">
        <div class="key" data-key="z">Z</div>
        <div class="key" data-key="x">X</div>
        <div class="key" data-key="c">C</div>
        <div class="key" data-key="v">V</div>
        <div class="key" data-key="b">B</div>
        <div class="key" data-key="n">N</div>
        <div class="key" data-key="m">M</div>
        <div class="key special" data-key="backspace">DEL</div>
    </div>
    <div class="keyboard-row">
        <div class="key special" data-key="-">-</div>
        <div class="key space" data-key=" ">SPACE</div>
        <div class="key special" data-key="enter">ENTER</div>
    </div>
</div>

<script>
// Canvas setup
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Game state
let gameActive = false;
let score = 0;
let level = 1;
let health = 100;
let currentMode = 'easy';
let maxWordLen = 3;
let spawnCounter = 0;
let currentInput = '';

let tank = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 20
};

let enemies = [];
let explosions = [];

// Word pool
const vocabulary = [
    "bug","css","app","int","java","html","code","loop","list","file","text","user","mode","play","save","load","exit","menu",
    "array","class","logic","input","float","score","debug","render",
    "object","canvas","string","output","python","script","system","window","memory","device","signal","buffer",
    "process","network","storage","compile","function","variable","terminal","operator","resource","protocol","pipeline",
    "compiler","debugger","argument","parameter","database","software","interface","firmware","emulator","registry","framework",
    "repository","encryption","decryption","dependency",
    "inheritance","polymorphism","serialization","optimization","architecture","performance","scalability",
    "encapsulation","multithreading","virtualization","cybersecurity","authentication","authorization","microservices",
    "synchronization","infrastructure","communication","implementation","configuration",
    "internationalization","decentralization","interoperability","cryptographically","microarchitecture",
    "reconfiguration","faultmanagement","authorizationtoken","distributedcomputing",
    "observability","faulttolerance","loadbalancing","concurrency","orchestration",
    "iteration","validation","deployment","integration","abstraction","refactoring",
    "computation","instruction","compilation","transmission","representation",
    "optimizationloop","dataprocessing","memoryallocation","processmanagement",
    "threadexecution","eventhandling","errorhandling","systemarchitecture",
    "networkprotocols","securitypolicies","resourceallocation","distributedstorage"
];

// Difficulty settings
const difficulties = {
    easy: { speed: 0.4, spawnRate: 180 },
    normal: { speed: 0.7, spawnRate: 140 },
    hard: { speed: 1.1, spawnRate: 90 },
    extreme: { speed: 1.9, spawnRate: 55 }
};

// Start button
document.getElementById('startBtn').addEventListener('click', startNewGame);
document.getElementById('startBtn').addEventListener('touchstart', (e) => {
    e.preventDefault();
    startNewGame();
});

function startNewGame() {
    document.getElementById('startScreen').classList.add('hide');
    gameActive = true;
    score = 0;
    level = 1;
    health = 100;
    maxWordLen = 3;
    spawnCounter = 0;
    currentInput = '';
    enemies = [];
    explosions = [];
    
    tank.x = canvas.width / 2;
    tank.y = canvas.height / 2;
    
    updateInputDisplay();
}

// Mode selection
document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
    });
});

// Keyboard input
let deleteInterval = null;
let deleteTimeout = null;

document.querySelectorAll('.key').forEach(key => {
    const keyValue = key.dataset.key;
    
    if (keyValue === 'backspace') {
        // Special handling for delete key - press and hold
        key.addEventListener('mousedown', startDelete);
        key.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startDelete();
        });
        
        key.addEventListener('mouseup', stopDelete);
        key.addEventListener('touchend', stopDelete);
        key.addEventListener('mouseleave', stopDelete);
        key.addEventListener('touchcancel', stopDelete);
    } else {
        // Normal keys
        key.addEventListener('click', () => handleKeyPress(keyValue));
        key.addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleKeyPress(keyValue);
        });
    }
});

function startDelete() {
    if (!gameActive) return;
    
    // Immediate first delete
    handleKeyPress('backspace');
    
    // Wait 300ms before starting continuous delete
    deleteTimeout = setTimeout(() => {
        deleteInterval = setInterval(() => {
            handleKeyPress('backspace');
        }, 100); // Delete every 100ms while holding
    }, 300);
}

function stopDelete() {
    if (deleteTimeout) {
        clearTimeout(deleteTimeout);
        deleteTimeout = null;
    }
    if (deleteInterval) {
        clearInterval(deleteInterval);
        deleteInterval = null;
    }
}
// Physical keyboard support
document.addEventListener('keydown', (e) => {
    if (!gameActive) return;
    
    if (e.key === 'Backspace') {
        handleKeyPress('backspace');
    } else if (e.key === 'Enter') {
        handleKeyPress('enter');
    } else if (e.key.length === 1) {
        handleKeyPress(e.key.toLowerCase());
    }
    e.preventDefault();
});

function handleKeyPress(key) {
    if (!gameActive) return;
    
    if (key === 'backspace') {
        currentInput = currentInput.slice(0, -1);
    } else if (key === 'enter') {
        checkWord();
    } else {
        currentInput += key;
    }
    
    updateInputDisplay();
    checkWord();
}

function updateInputDisplay() {
    document.getElementById('inputDisplay').textContent = currentInput || '';
}

function checkWord() {
    const typed = currentInput.toLowerCase();
    
    for (let i = enemies.length - 1; i >= 0; i--) {
        if (enemies[i].word.toLowerCase() === typed) {
            const enemy = enemies[i];
            createExplosion(enemy.x, enemy.y);
            score += enemy.isBoss ? 50 : 10;
            enemies.splice(i, 1);
            currentInput = '';
            updateInputDisplay();
            
            if (score % 100 === 0) {
                level++;
                if (level % 2 === 0 && maxWordLen < 25) {
                    maxWordLen += 2;
                }
                if (level % 5 === 0) {
                    createEnemy(true);
                }
            }
            break;
        }
    }
}

// Enemy spawning
function createEnemy(isBoss = false) {
    // Only spawn from top, left, and right (not bottom to avoid keyboard area)
    const side = Math.floor(Math.random() * 3);
    let x, y;
    
    // Avoid spawning in bottom 35% where keyboard and input are
    const safeHeight = canvas.height * 0.65;
    
    if (side === 0) { 
        // Left side - only spawn in safe upper portion
        x = 0; 
        y = Math.random() * safeHeight; 
    }
    else if (side === 1) { 
        // Right side - only spawn in safe upper portion
        x = canvas.width; 
        y = Math.random() * safeHeight; 
    }
    else { 
        // Top side - full width is safe
        x = Math.random() * canvas.width; 
        y = 0; 
    }
    
    const validWords = vocabulary.filter(w => w.length <= maxWordLen);
    const wordPool = validWords.length > 0 ? validWords : vocabulary.filter(w => w.length <= maxWordLen + 3);
    const randomWord = wordPool[Math.floor(Math.random() * wordPool.length)];
    
    const word = isBoss ? 'BOSS-' + randomWord : randomWord;
    
    enemies.push({
        word: word,
        x: x,
        y: y,
        isBoss: isBoss
    });
}

// Update enemies
function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        const dx = tank.x - enemy.x;
        const dy = tank.y - enemy.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        
        enemy.x += (dx / distance) * difficulties[currentMode].speed;
        enemy.y += (dy / distance) * difficulties[currentMode].speed;
        
        if (distance < tank.radius + 10) {
            health -= enemy.isBoss ? 20 : 10;
            enemies.splice(i, 1);
        }
    }
}

// Draw everything
function drawTank() {
    ctx.fillStyle = '#0f0';
    ctx.beginPath();
    ctx.arc(tank.x, tank.y, tank.radius, 0, Math.PI * 2);
    ctx.fill();
}

function drawEnemies() {
    ctx.fillStyle = '#0f0';
    ctx.font = '18px monospace';
    enemies.forEach(enemy => {
        ctx.fillText(enemy.word, enemy.x, enemy.y);
    });
}

function createExplosion(x, y) {
    for (let i = 0; i < 25; i++) {
        explosions.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 40
        });
    }
}

function updateExplosions() {
    for (let i = explosions.length - 1; i >= 0; i--) {
        const particle = explosions[i];
        particle.x += particle.vx;
        particle.y += particle.vy;
        particle.life--;
        
        if (particle.life <= 0) {
            explosions.splice(i, 1);
        }
    }
}

function drawExplosions() {
    ctx.fillStyle = '#0f0';
    explosions.forEach(p => {
        ctx.fillRect(p.x, p.y, 3, 3);
    });
}

function drawBackground() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.fillStyle = 'rgba(0, 51, 51, 0.3)';
    ctx.font = '14px monospace';
    for (let i = 0; i < 40; i++) {
        const char = String.fromCharCode(33 + Math.random() * 94);
        const x = Math.random() * canvas.width;
        const y = Math.random() * canvas.height;
        ctx.fillText(char, x, y);
    }
}

// Update UI
function updateUI() {
    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('levelDisplay').textContent = level;
    document.getElementById('healthDisplay').textContent = health;
}

// Game loop
function gameLoop() {
    drawBackground();
    drawTank();
    drawEnemies();
    drawExplosions();
    
    if (gameActive) {
        updateEnemies();
        updateExplosions();
        
        spawnCounter++;
        const spawnThreshold = difficulties[currentMode].spawnRate - (level * 3);
        if (spawnCounter >= Math.max(spawnThreshold, 30)) {
            createEnemy();
            spawnCounter = 0;
        }
        
        if (health <= 0) {
            gameActive = false;
            setTimeout(() => {
                alert('Game Over! Final Score: ' + score);
                document.getElementById('startScreen').classList.remove('hide');
            }, 100);
        }
    }
    
    updateUI();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
